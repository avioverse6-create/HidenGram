name: Build HidenGram APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.toml'
      - 'app/src/main/AndroidManifest.xml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HidenGram
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Fetch the original PrismalAGSL source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/styropyr0/PrismalAGSL.git PrismalAGSL
          git -C PrismalAGSL checkout 0da7d9c0676bd9a9eb999d2b0905de880378da9d
          mkdir -p gradle
          cp PrismalAGSL/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/^coreKtx = "1.19.0"/coreKtx = "1.17.0"/' gradle/libs.versions.toml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("PrismalAGSL/Prismal/build.gradle.kts")
          s = p.read_text()
          s = s.replace("alias(libs.plugins.android.library)", 'id("com.android.library")')
          s = s.replace("alias(libs.plugins.compose.compiler)", 'id("org.jetbrains.kotlin.plugin.compose")')
          s = s.replace(
              'id("com.android.library")\n    id("org.jetbrains.kotlin.plugin.compose")',
              'id("com.android.library")\n    id("org.jetbrains.kotlin.android")\n    id("org.jetbrains.kotlin.plugin.compose")'
          )
          s, count = re.subn(r"compileSdk\s*\{\s*version\s*=\s*release\(37\)\s*\}", "compileSdk = 36", s)
          if count != 1:
              raise SystemExit(f"Expected one compileSdk 37 block, found {count}")
          if 'id("org.jetbrains.kotlin.android")' not in s:
              raise SystemExit("Kotlin Android plugin missing from Prismal module")
          s = s.replace("sourceCompatibility = JavaVersion.VERSION_11", "sourceCompatibility = JavaVersion.VERSION_17")
          s = s.replace("targetCompatibility = JavaVersion.VERSION_11", "targetCompatibility = JavaVersion.VERSION_17")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s or "targetCompatibility = JavaVersion.VERSION_17" not in s:
              raise SystemExit("Could not align Prismal Java target to 17")
          p.write_text(s)

          # Tune the upstream Prismal bottom bar itself: a visible frosted-glass
          # body and a properly defined selected capsule, not a faint outline.
          glass = Path("PrismalAGSL/Prismal/src/main/java/com/styropyr0/prismal/components/PrismalGlassBottomTabs.kt")
          g = glass.read_text()
          g = g.replace(
              'Color(0xFFFAFAFA).copy(0.4f)',
              'Color(0xFFFAFAFA).copy(0.64f)'
          )
          g = g.replace(
              'Color(0xFF121212).copy(0.4f)',
              'Color(0xFF17191E).copy(0.78f)'
          )
          g = g.replace(
              'else Color.White.copy(0.1f)',
              'else Color.White.copy(0.24f)'
          )
          if 'Color(0xFF17191E).copy(0.78f)' not in g:
              raise SystemExit("Prismal dark glass surface tuning was not applied")
          if 'else Color.White.copy(0.24f)' not in g:
              raise SystemExit("Prismal selected capsule highlight tuning was not applied")
          glass.write_text(g)

          # The upstream selection lens is intentionally dormant at rest (progress=0),
          # which makes the selected item look like a flat grey pill. Keep the original
          # Prismal lens active at rest, then let press/drag animate it to full intensity.
          g = glass.read_text()
          g = g.replace(
              "refractionHeight = with(density) { dropletRefractionHeight.toPx() } * effectScale * progress,",
              "refractionHeight = with(density) { dropletRefractionHeight.toPx() } * effectScale * (0.78f + 0.22f * progress),"
          )
          g = g.replace(
              "refractionAmount = with(density) { dropletRefractionAmount.toPx() } * effectScale * progress,",
              "refractionAmount = with(density) { dropletRefractionAmount.toPx() } * effectScale * (0.78f + 0.22f * progress),"
          )
          g = g.replace(
              "chromaticAberration = dropletChromaticAberration.coerceAtLeast(0f)",
              "chromaticAberration = (dropletChromaticAberration * (0.78f + 0.22f * progress)).coerceAtLeast(0f)"
          )
          g = g.replace(
              "PrismalSpecular.Default.copy(alpha = progress)",
              "PrismalSpecular.Default.copy(alpha = 0.78f + 0.22f * progress)"
          )
          g = g.replace(
              "PrismalDepthShadow(alpha = progress)",
              "PrismalDepthShadow(alpha = 0.72f + 0.28f * progress)"
          )
          g = g.replace(
              "alpha = lerp(RestingInsetAlpha, 1f, progress)",
              "alpha = lerp(0.78f, 1f, progress)"
          )
          if "0.78f + 0.22f * progress" not in g:
              raise SystemExit("Always-on Prismal selection lens patch did not apply")
          glass.write_text(g)
          print("Configured original Prismal source: full-surface glass + always-on refractive selection lens")
          PY
      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HidenGram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
